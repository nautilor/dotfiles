quickshell:
  remote: github:nautilor/quickshell-notch
nvim:
  remote: github:nautilor/nvim
zathura:
  remote: github:nautilor/zathurarc
ideavim:
  remote: github:nautilor/ideavim
direnv:
  source: ./direnv/
  destination: ~/.config/direnv
zsh:
  .zshrc:
    source: ./zsh/.zshrc
    destination: ~/.zshrc
  .p10k.zsh:
    source: ./zsh/.p10k.zsh
    destination: ~/.p10k.zsh
  .zsh:
    source: ./zsh/.zsh/
    destination: ~/.zsh
bash:
  .bashrc:
    source: ./bash/.bashrc
    destination: ~/.bashrc
  .bash_profile:
    source: ./bash/.bash_profile
    destination: ~/.bash_profile
  .bash:
    source: ./bash/.bash/
    destination: ~/.bash
