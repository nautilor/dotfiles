# Basic window & workspace interactions
bind = SUPER SHIFT, Q, killactive
bind = SUPER, K, exec, hyprctl kill
bind = SUPER CTRL, C, centerwindow
bind = SUPER, S, swapnext
bind = SUPER, F, exec, hyprctl dispatch fullscreen 1
bind = SUPER SHIFT, F, exec, hyprctl dispatch fullscreen 2

bind = SUPER, LEFT, exec, ~/.config/hypr/bin/window_focus.sh l
bind = SUPER, RIGHT, exec, ~/.config/hypr/bin/window_focus.sh r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER SHIFT, LEFT, movewindoworgroup, l
bind = SUPER SHIFT, RIGHT, movewindoworgroup, r
bind = SUPER SHIFT, UP, movewindoworgroup, u
bind = SUPER SHIFT, DOWN, movewindoworgroup, d
bind = SUPER SHIFT, H, movewindoworgroup, l
bind = SUPER SHIFT, L, movewindoworgroup, r
bind = SUPER SHIFT, K, movewindoworgroup, u
bind = SUPER SHIFT, J, movewindoworgroup, d

bind = SUPER, 1, exec, ~/.config/hypr/bin/workspace_focus.sh q
bind = SUPER, 2, exec, ~/.config/hypr/bin/workspace_focus.sh w
bind = SUPER, 3, exec, ~/.config/hypr/bin/workspace_focus.sh e
bind = SUPER, 4, exec, ~/.config/hypr/bin/workspace_focus.sh r
bind = SUPER, 5, exec, ~/.config/hypr/bin/workspace_focus.sh t
bind = SUPER, Q, exec, ~/.config/hypr/bin/workspace_focus.sh q
bind = SUPER, W, exec, ~/.config/hypr/bin/workspace_focus.sh w
bind = SUPER, E, exec, ~/.config/hypr/bin/workspace_focus.sh e
bind = SUPER, R, exec, ~/.config/hypr/bin/workspace_focus.sh r
bind = SUPER, T, exec, ~/.config/hypr/bin/workspace_focus.sh t

bind = SUPER CTRL, 1, exec, ~/.config/hypr/bin/workspace_move.sh q
bind = SUPER CTRL, 2, exec, ~/.config/hypr/bin/workspace_move.sh w
bind = SUPER CTRL, 3, exec, ~/.config/hypr/bin/workspace_move.sh e
bind = SUPER CTRL, 4, exec, ~/.config/hypr/bin/workspace_move.sh r
bind = SUPER CTRL, 5, exec, ~/.config/hypr/bin/workspace_move.sh t
bind = SUPER CTRL, Q, exec, ~/.config/hypr/bin/workspace_move.sh q
bind = SUPER CTRL, W, exec, ~/.config/hypr/bin/workspace_move.sh w
bind = SUPER CTRL, E, exec, ~/.config/hypr/bin/workspace_move.sh e
bind = SUPER CTRL, R, exec, ~/.config/hypr/bin/workspace_move.sh r
bind = SUPER CTRL, T, exec, ~/.config/hypr/bin/workspace_move.sh t

bind = SUPER CTRL, h,     resizeactive, -60   0
bind = SUPER CTRL, j,     resizeactive,   0  60
bind = SUPER CTRL, k,     resizeactive,   0 -60
bind = SUPER CTRL, l,     resizeactive,  60   0
bind = SUPER CTRL, left,  resizeactive, -60   0
bind = SUPER CTRL, right, resizeactive,  60   0
bind = SUPER CTRL, up,    resizeactive,   0 -60
bind = SUPER CTRL, down,  resizeactive,   0  60


# Basic interactions between monitors
bind = SUPER, BACKSPACE, focusmonitor, +1
bind = SUPER CTRL, BACKSPACE, movewindow, mon:+1

# Programs
bind = SUPER, RETURN, exec, kitty 
bind = SUPER SHIFT, D, exec, rofi -show run -theme application
bind = SUPER SHIFT, M, exec, hyprlock

# Media
bind = SUPER, P, togglespecialworkspace
bind = SUPER CTRL, P, movetoworkspacesilent, special 
bind = SUPER SHIFT, P, exec, playerctl -p spotify play-pause
bind = SUPER SHIFT, I, exec, playerctl -p spotify previous
bind = SUPER SHIFT, O, exec, playerctl -p spotify next

# Script
bind = SUPER, D, exec, ~/.config/hypr/bin/quicktoggle.sh launcher

bind = SUPER SHIFT, W , exec, ~/.config/hypr/bin/wallpaper.sh init

bind = SUPER SHIFT, X, exec, ~/.config/hypr/bin/quicktoggle.sh powerMenu
bind = SUPER CTRL, X, exec, ~/.config/hypr/bin/quicktoggle.sh powerMenu
bind = , XF86PowerOff, exec, ~/.config/hypr/bin/quicktoggle.sh powerMenu

bind = SUPER, V, exec, ~/.config/hypr/bin/quicktoggle.sh clipMenu
bind = SUPER SHIFT, V, exec, ~/.config/hypr/bin/clipboard.sh clear

bind = SUPER CTRL, M, exec, ~/.config/hypr/bin/caffeine.sh toggle 

bind = SUPER, F11, exec, ~/.config/hypr/bin/colorpicker.sh

bind = SUPER SHIFT, S, exec, ~/.config/hypr/bin/screenshot.sh
bind = , Print, exec, ~/.config/hypr/bin/screenshot.sh

bind = SUPER CTRL, D, exec, ~/.config/hypr/bin/utils.sh
bind = SUPER, C, exec, ~/.config/hypr/bin/floating.sh
bind = SUPER, O, exec, ~/.config/hypr/bin/quicktoggle.sh windowSwitcher 
bind = SUPER, B, exec, ~/.config/hypr/bin/focus_mode.sh
bind = SUPER SHIFT, R, exec, ~/.config/hypr/bin/recorder.sh
bind = SUPER, F4, exec, ~/.config/hypr/bin/backlight.sh

# Volume Control
bind = SUPER, bracketleft, exec, ~/.config/hypr/bin/osd.sh volume lower
bind = SUPER, bracketright, exec, ~/.config/hypr/bin/osd.sh volume raise
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/bin/osd.sh volume raise
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/bin/osd.sh volume lower
bind = , XF86AudioMute, exec, ~/.config/hypr/bin/osd.sh volume mute-toggle

# Microphone Control
bind= , XF86AudioMicMute, exec, ~/.config/hypr/bin/mic_toggle.sh 
bind = SUPER CTRL, S, exec, ~/.config/hypr/bin/mic_toggle.sh

# Brightness Control
bind= , XF86MonBrightnessDown, exec, ~/.config/hypr/bin/osd.sh brightness lower
bind= , XF86MonBrightnessUp, exec, ~/.config/hypr/bin/osd.sh brightness raise

bind = SUPER, period, layoutmsg, move +col
bind = SUPER, comma, layoutmsg, move -col
bind = SUPER SHIFT, period, layoutmsg, swapcol r
bind = SUPER SHIFT, comma, layoutmsg, swapcol l


# focus windows
bind = SUPER, F1, exec, ~/.config/hypr/bin/focus_by_class.sh kitty
bind = SUPER, F2, exec, ~/.config/hypr/bin/focus_by_class.sh "zen||google-chrome"
