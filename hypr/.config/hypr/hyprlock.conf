# GENERAL
general {
  hide_cursor = true
}

cursor {
 no_hardware_cursor = 1 
}

# BACKGROUND
background {
  monitor =
	color = rgba(23, 23, 26, 1.0)
}

image {
    monitor =
    path = $HOME/.config/hypr/assets/logo.png
    size = 200
		rounding = 0
    border_size = 0
    halign = right
    valign = bottom
    position = -75, 75
    zindex = 0
}
# INPUT FIELD
input-field {
    monitor =
		size = 50%, 25%
    outline_thickness = 3
		rounding = 100
		dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
		dots_spacing = 0.4 # Scale of dots' absolute size, 0.0 - 1.0
		dots_text_format = <b>*</b>
    dots_center = true
    outer_color = rgba(244, 244, 244, 0.00)
		inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
		font_family = JetBrainsMono Nerd Font Propo
    placeholder_text = <span foreground="##FCFCFC">|</span>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}
